name: Native macOS build
on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  protocol:
    name: Protocol tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify protocol fixtures
        run: ./test-protocol.sh

  build:
    name: Native macOS build
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and sign universal app
        run: ./scripts/build-app.sh --universal
      - name: Check native app launch
        run: ./scripts/smoke-test-app.sh
      - name: Upload macOS app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Basilisk-Control-macOS-universal
          path: |
            dist/Basilisk-Control-macOS.zip
            dist/Basilisk-Control-macOS.zip.sha256
          if-no-files-found: error
          retention-days: 30
